name: Keep Render bot awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RENDER_URL: ${{ secrets.RENDER_URL }}
    steps:
      - name: Ping /health
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL secret hali qo'yilmagan."
            exit 0
          fi
          curl -fsS --retry 2 --retry-delay 5 "$RENDER_URL/health" > /dev/null
          echo "Ping OK"
